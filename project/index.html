<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skred REPL (Gleam + Lustre)</title>
<script src="coi-serviceworker.min.js"></script>
<style>
  :root { --bg:#14161a; --panel:#1c1f25; --fg:#d7dae0; --dim:#7d8590; --echo:#7cc4ff; --accent:#ffb454; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); }
  body { font:15px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #app { height:100%; }
  .repl { display:flex; flex-direction:column; height:100%; max-width:860px; margin:0 auto; padding:12px; box-sizing:border-box; gap:10px; }
  header { display:flex; align-items:center; justify-content:space-between; }
  h1 { margin:0; font-size:1.1rem; font-weight:600; color:var(--accent); }
  button { font:inherit; padding:6px 12px; background:var(--panel); color:var(--fg); border:1px solid #333a44; border-radius:6px; cursor:pointer; }
  button:focus-visible, .cmd:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .output { flex:1; overflow-y:auto; background:var(--panel); border-radius:8px; padding:10px 12px; white-space:pre-wrap; word-break:break-word; }
  .echo { color:var(--echo); }
  .note { color:var(--dim); }
  .cmd { font:inherit; padding:10px 12px; background:var(--panel); color:var(--fg); border:1px solid #333a44; border-radius:8px; }
  .cmd:disabled { opacity:.5; }
  .preview { display:flex; flex-wrap:wrap; gap:4px 6px; min-height:1.6em; font-size:.85em; }
  .chip { padding:0 6px; border-radius:4px; background:var(--panel); border:1px solid #333a44; }
  .voice { color:#7cc4ff; } .pitch { color:#ffb454; } .mix { color:#a5d6a7; }
  .wave { color:#ce93d8; } .time { color:#f48fb1; }
  .text { color:var(--dim); } .raw { color:var(--dim); border-style:dashed; }
  .hint { color:var(--dim); font-style:italic; }
  .row { display:flex; gap:8px; }
  .row .cmd { flex:1; min-width:0; }
  .tab { min-width:44px; }
  .completions { display:flex; flex-wrap:wrap; gap:4px 6px; font-size:.85em; }
  .completions:empty { display:none; }
  .cand { padding:0 6px; border-radius:4px; border:1px solid #333a44; }
  .cand.cur { background:var(--accent); color:#14161a; border-color:var(--accent); }
</style>
</head>
<body>
<div id="app"></div>

<!-- Emscripten engine glue: gives globalThis.Module (fetched by ./fetch-wasm.sh) -->
<script src="skred_api.js"></script>
<!-- Gleam + Lustre application -->
<script type="module" src="app.js"></script>
<script type="module">
  // Fallback for unbundled development builds if app.js is not present
  if (!globalThis.skodePlan) {
    import("./build/dev/javascript/skred_repl/skred_repl.mjs")
      .then(m => m.main())
      .catch(() => {});
  }
</script>
</body>
</html>
