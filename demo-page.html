<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skred REPL (Gleam + Lustre)</title>
<style>
:root{--bg:#f5f6f8;--panel:#ffffff;--fg:#1d2128;--dim:#5f6773;--line:#cfd4dc;--accent:#a35200;--on-accent:#ffffff;
 --c-voice:#0b5cad;--c-pitch:#a35200;--c-mix:#2e7d32;--c-wave:#8e24aa;--c-time:#c2185b;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--panel:#1c1f25;--fg:#d7dae0;--dim:#8a929d;--line:#333a44;--accent:#ffb454;--on-accent:#14161a;
 --c-voice:#7cc4ff;--c-pitch:#ffb454;--c-mix:#a5d6a7;--c-wave:#ce93d8;--c-time:#f48fb1}}
:root[data-theme="dark"]{--bg:#14161a;--panel:#1c1f25;--fg:#d7dae0;--dim:#8a929d;--line:#333a44;--accent:#ffb454;--on-accent:#14161a;
 --c-voice:#7cc4ff;--c-pitch:#ffb454;--c-mix:#a5d6a7;--c-wave:#ce93d8;--c-time:#f48fb1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{display:flex;flex-direction:column;font:15px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.banner{margin:0;padding:8px 12px 0;max-width:860px;width:100%;box-sizing:border-box;align-self:center;color:var(--dim);font-size:.8em}
#app{flex:1;min-height:0}
.repl{display:flex;flex-direction:column;height:100%;max-width:860px;margin:0 auto;padding:12px;box-sizing:border-box;gap:10px}
header{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.1rem;color:var(--accent)}
button{font:inherit;padding:6px 12px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.cmd:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.output{flex:1;min-height:0;overflow-y:auto;background:var(--panel);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}
.echo{color:var(--c-voice)}.note{color:var(--dim)}
.preview,.completions{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:.85em}
.preview{min-height:1.6em}
.completions:empty{display:none}
.chip,.cand{padding:0 6px;border-radius:4px;background:var(--panel);border:1px solid var(--line)}
.voice{color:var(--c-voice)}.pitch{color:var(--c-pitch)}.mix{color:var(--c-mix)}.wave{color:var(--c-wave)}.time{color:var(--c-time)}
.text{color:var(--dim)}.raw{color:var(--dim);border-style:dashed}
.hint{color:var(--dim);font-style:italic}
.cand.cur{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.row{display:flex;gap:8px}
.cmd{flex:1;min-width:0;font:inherit;padding:10px 12px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px}
.cmd:disabled{opacity:.5}
.tab{min-width:44px}
</style>
</head>
<body>
<p class="banner">Gleam + Lustre REPL with the ands-style Skode lexer. The engine here is a small Web Audio stand-in (v, f, n, a in dB, l as level, and defers); the real skred WASM engine plugs into the same calls. Tab completes.</p>
<div id="app"></div>
<script>
// Stand-in for the skred WASM engine: same Module surface the Gleam FFI calls.
// Parsing is done by the Gleam lexer (skodePlan); only the sound is improvised here.

})();

</script>
